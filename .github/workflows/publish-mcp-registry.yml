name: Publish MCP Registry metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-prodhub-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out agent kit
        uses: actions/checkout@v4

      - name: Install pinned MCP publisher
        env:
          PUBLISHER_VERSION: v1.8.5
          PUBLISHER_SHA256: 2d151ac57275c9a6684d9d22b1cba81058bab195ea0a162e8fce3c6a5ec32812
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/${archive}"
          printf '%s  %s\n' "$PUBLISHER_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher
          chmod +x mcp-publisher

      - name: Validate MCP server metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish ProdHub to the official MCP Registry
        run: ./mcp-publisher publish server.json
